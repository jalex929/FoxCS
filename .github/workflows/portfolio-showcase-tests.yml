name: Portfolio showcase tests

# Runs the public showcase's own checks from inside this (operational) repo,
# so a change to portfolio-showcase/ that would fail after export is caught
# here first. Also proves export_showcase.sh still produces a clean,
# fresh-history repo. Synthetic data only, never touches real student data.

on:
  push:
    paths:
      - 'portfolio-showcase/**'
      - '00-project-overview/portfolio-prep/**'
      - '.github/workflows/portfolio-showcase-tests.yml'
  pull_request:
    paths:
      - 'portfolio-showcase/**'
      - '00-project-overview/portfolio-prep/**'
      - '.github/workflows/portfolio-showcase-tests.yml'

jobs:
  showcase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leak scanner
        run: python tools/check_showcase_clean.py
      - name: Grader tests
        run: python -m unittest discover -s grader/tests -v
      - name: On-submission grader and release check at 100% line and branch coverage
        run: |
          python -m pip install --quiet coverage==7.6.1
          python -m coverage run --branch --include=grader/on_submission.py,grader/release_check.py -m unittest discover -s grader/tests
          python -m coverage report -m --fail-under=100
      - name: Eval harness tests
        run: python -m unittest discover -s evals/tests -v
      - name: Repo hygiene and scanner tests
        run: python -m unittest discover -s tools/tests -v
      - name: Eval suite against reference judgments
        run: python evals/run_evals.py

  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export to a fresh repo
        run: bash 00-project-overview/portfolio-prep/export_showcase.sh "$RUNNER_TEMP/foxcs-showcase"
      - name: Exported repo has exactly one commit and no FoxCS history
        run: |
          cd "$RUNNER_TEMP/foxcs-showcase"
          test "$(git rev-list --count HEAD)" -eq 1
          test -z "$(git ls-files | grep -iE '\.pdf$|starter context|teacher-materials' || true)"

  mutation:
    # Same gate as the showcase repo: no unexplained surviving mutants.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: portfolio-showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mutation testing
        run: python tools/mutation_test.py --jobs 4
