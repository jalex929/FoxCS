<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Verdana, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#144d61"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="340" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#144d61">Breaking It Down: The Five-Question Routine</text>

  <!-- connecting line -->
  <line x1="100" y1="170" x2="900" y2="170" stroke="#144d61" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 1: STOP -->
  <g transform="translate(100,170)">
    <circle cx="0" cy="0" r="52" fill="#1f6f8b"/>
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">STOP</text>
    <text x="0" y="14" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  </g>
  <text x="100" y="252" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">What information</text>
  <text x="100" y="270" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">do I have?</text>
  <text x="100" y="292" text-anchor="middle" font-size="12" fill="#5b6472">Numbers, facts, labels,</text>
  <text x="100" y="308" text-anchor="middle" font-size="12" fill="#5b6472">diagrams, context</text>

  <!-- Step 2: FIND -->
  <g transform="translate(300,170)">
    <circle cx="0" cy="0" r="52" fill="#1f6f8b"/>
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">FIND</text>
    <text x="0" y="14" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  </g>
  <text x="300" y="252" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">What am I trying</text>
  <text x="300" y="270" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">to determine?</text>
  <text x="300" y="292" text-anchor="middle" font-size="12" fill="#5b6472">"I need to find ____"</text>

  <!-- Step 3: CONNECT -->
  <g transform="translate(500,170)">
    <circle cx="0" cy="0" r="52" fill="#1f6f8b"/>
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">CONNECT</text>
    <text x="0" y="14" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  </g>
  <text x="500" y="252" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">What skill could</text>
  <text x="500" y="270" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">help?</text>
  <text x="500" y="292" text-anchor="middle" font-size="12" fill="#5b6472">A formula, operation,</text>
  <text x="500" y="308" text-anchor="middle" font-size="12" fill="#5b6472">or reference</text>

  <!-- Step 4: TRY -->
  <g transform="translate(700,170)">
    <circle cx="0" cy="0" r="52" fill="#1f6f8b"/>
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">TRY</text>
    <text x="0" y="14" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  </g>
  <text x="700" y="252" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">What strategy</text>
  <text x="700" y="270" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">can I try?</text>
  <text x="700" y="292" text-anchor="middle" font-size="12" fill="#5b6472">Equation, diagram,</text>
  <text x="700" y="308" text-anchor="middle" font-size="12" fill="#5b6472">estimate, eliminate</text>

  <!-- Step 5: CHECK -->
  <g transform="translate(900,170)">
    <circle cx="0" cy="0" r="52" fill="#d98a3d"/>
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">CHECK</text>
    <text x="0" y="14" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  </g>
  <text x="900" y="252" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">Does my answer</text>
  <text x="900" y="270" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#144d61">make sense?</text>
  <text x="900" y="292" text-anchor="middle" font-size="12" fill="#5b6472">Size, sign, unit,</text>
  <text x="900" y="308" text-anchor="middle" font-size="12" fill="#5b6472">the actual question</text>
</svg>
