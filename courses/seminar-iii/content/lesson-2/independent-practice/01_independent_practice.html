<!-- Seminar III -- Lesson 2: Independent Practice.
     Rebuilt 2026-09-10 to replace the live H5P version (h5pactivity
     cmid=256), whose H5P.Essay fields all had `enableRetry: false`
     -- once a student clicked Submit, that field locked, the same trap as
     the mod_lesson essay-lock bug documented for Lesson 1, just in a
     different content type. Real content extracted directly from the live
     h5pactivity's content.json, not re-invented. Essay items are save-only
     (no correctness check), matching the original H5P.Essay config's own
     `"ignoreScoring": true` -- never actually auto-graded live, so this
     doesn't add grading that wasn't there. MC items keep real correct/
     incorrect checking. Generated by generate_seminar3_practice_page.py
     from the extracted content.json, not hand-typed, given the item count.

     Telemetry/save pattern matches FoxCS: Python's local_foxcstelemetry
     Option C and Seminar III's own 1.5 Guided Practice reference build
     (courses/seminar-iii/content/lesson-1/guided-practice/). Deliberately
     NO retry lock anywhere. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson 2: Independent Practice</title>
<style>
  :root {
    --ink: #1a2230; --muted: #5b6472; --accent: #1f6f8b; --accent-dark: #144d61;
    --accent-bg: #eaf3f6; --line: #d7dde3; --paper: #ffffff; --floor: #f4f6f8;
    --good: #2f7a4f; --bad: #a33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--floor); color: var(--ink); font-family: Verdana, Arial, Helvetica, sans-serif; }
  .page { max-width: 800px; margin: 0 auto; background: var(--paper); padding-bottom: 2rem; }
  .banner { background: var(--accent-dark); color: white; padding: 2.2rem 2.5rem 1.6rem; }
  .banner .kicker { font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase; color: #cfe6ee; font-weight: bold; margin: 0 0 0.4rem; }
  .banner h1 { font-size: 2rem; margin: 0 0 0.4rem; }
  .banner p { margin: 0; color: #dff1f6; font-size: 1rem; }
  #content-root { padding: 0 2.5rem; }
  #content-root h2 { font-size: 1.3rem; color: var(--accent-dark); margin: 1.6rem 0 0.8rem; }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1rem; background: #fbfcfd; }
  .item .prompt { font-weight: bold; margin-bottom: 0.6rem; }
  .item .prompt p { margin: 0; }
  textarea.essay { width: 100%; min-height: 4.5em; font-family: Verdana, Arial, sans-serif; font-size: 0.95rem; padding: 0.6rem; border: 1px solid var(--line); border-radius: 5px; box-sizing: border-box; }
  .mc-choice { display: block; margin: 0.35rem 0; font-size: 0.95rem; }
  .save-btn, .check-btn { font-family: Verdana, Arial, sans-serif; background: var(--accent); color: white; border: none; padding: 0.5rem 1.1rem; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 0.4rem; }
  .save-btn:hover, .check-btn:hover { background: var(--accent-dark); }
  .feedback { margin-top: 0.5rem; font-size: 0.9rem; min-height: 1.2em; }
  .feedback.correct { color: var(--good); }
  .feedback.incorrect { color: var(--bad); }
  .feedback.saved { color: var(--good); }
  .resume-badge { display: inline-block; background: var(--accent-bg); color: var(--accent-dark); border: 1px solid var(--accent); border-radius: 5px; padding: 0.2rem 0.6rem; font-size: 0.85rem; margin-bottom: 0.5rem; }
  .worked { background: var(--accent-bg); border-left: 6px solid var(--accent); padding: 0.9rem 1.2rem; margin-bottom: 1rem; }
  #save-status-global { text-align: center; font-size: 0.9rem; color: var(--good); margin-top: 1.5rem; min-height: 1.2em; padding-bottom: 1rem; }
</style>
</head>
<body>
<div class="page">
  <div class="banner">
    <p class="kicker">Seminar III &middot; Lesson 2</p>
    <h1>Independent Practice</h1>
    <p>Show your work where it applies. Work through these on your own. You can revise any answer below as many times as you want before moving on -- nothing locks.</p>
  </div>

  <div id="content-root"></div>
  <div id="save-status-global"></div>
</div>

<script>
var CMID = "__CMID__";
var ENDPOINT = '/local/foxcstelemetry/log.php';
var sesskey = null;
var globalStatus = document.getElementById('save-status-global');
var root = document.getElementById('content-root');

var CONTENT = [{"type": "text", "html": "<h2>Independent Practice: Numbers and Operations</h2><p>Show your work where it applies. Work through these on your own.</p>"}, {"type": "text", "html": "<h2>Comparing Integers and Absolute Value</h2>"}, {"type": "essay", "id": "e1", "prompt": "<p>Compare: &minus;18 ___ &minus;25 (write &gt; or &lt;)</p>"}, {"type": "essay", "id": "e2", "prompt": "<p>Order from least to greatest: 4, &minus;9, &minus;2, 8, &minus;15</p>"}, {"type": "essay", "id": "e3", "prompt": "<p>Which is greater, &minus;6 or &minus;19?</p>"}, {"type": "essay", "id": "e4", "prompt": "<p>Find |&minus;22|.</p>"}, {"type": "essay", "id": "e5", "prompt": "<p>Find |17|.</p>"}, {"type": "essay", "id": "e6", "prompt": "<p>A learner says &minus;50 is less than &minus;12. Is the learner correct? Explain.</p>"}, {"type": "essay", "id": "e7", "prompt": "<p>Compare: |&minus;9| ___ |&minus;4| (write &gt; or &lt;)</p>"}, {"type": "text", "html": "<h2>Adding and Subtracting Integers</h2>"}, {"type": "essay", "id": "e8", "prompt": "<p>&minus;11 + (&minus;9) = ?</p>"}, {"type": "essay", "id": "e9", "prompt": "<p>&minus;15 + 22 = ?</p>"}, {"type": "essay", "id": "e10", "prompt": "<p>9 &minus; (&minus;11) = ?</p>"}, {"type": "essay", "id": "e11", "prompt": "<p>&minus;18 &minus; 7 = ?</p>"}, {"type": "essay", "id": "e12", "prompt": "<p>25 &minus; 33 = ?</p>"}, {"type": "essay", "id": "e13", "prompt": "<p>&minus;4 + (&minus;8) + 15 = ?</p>"}, {"type": "essay", "id": "e14", "prompt": "<p>16 + (&minus;20) = ?</p>"}, {"type": "text", "html": "<h2>Multiplying and Dividing Integers</h2>"}, {"type": "essay", "id": "e15", "prompt": "<p>&minus;6 &times; 9 = ?</p>"}, {"type": "essay", "id": "e16", "prompt": "<p>&minus;7 &times; &minus;8 = ?</p>"}, {"type": "essay", "id": "e17", "prompt": "<p>84 &divide; (&minus;7) = ?</p>"}, {"type": "essay", "id": "e18", "prompt": "<p>&minus;96 &divide; &minus;8 = ?</p>"}, {"type": "essay", "id": "e19", "prompt": "<p>&minus;3 &times; 5 &times; &minus;4 = ?</p>"}, {"type": "essay", "id": "e20", "prompt": "<p>&minus;45 &divide; 9 = ?</p>"}, {"type": "text", "html": "<h2>Order of Operations</h2>"}, {"type": "essay", "id": "e21", "prompt": "<p>7 + 4 &times; 5 = ?</p>"}, {"type": "essay", "id": "e22", "prompt": "<p>36 &divide; 6 &times; 3 = ?</p>"}, {"type": "essay", "id": "e23", "prompt": "<p>18 &minus; 9 + 4 = ?</p>"}, {"type": "essay", "id": "e24", "prompt": "<p>(6 + 2) &times; 3 &minus; 7 = ?</p>"}, {"type": "essay", "id": "e25", "prompt": "<p>10 + 3 &times; (8 &minus; 5) = ?</p>"}, {"type": "text", "html": "<h2>Estimation and Reasonableness</h2>"}, {"type": "essay", "id": "e26", "prompt": "<p>Estimate: 78 &times; 22.</p>"}, {"type": "essay", "id": "e27", "prompt": "<p>Estimate: 412 &divide; 41.</p>"}, {"type": "essay", "id": "e28", "prompt": "<p>A learner calculates 39 &times; 61 and gets 279. Is this reasonable? Explain your thinking.</p>"}];

var ESSAY_IDS = CONTENT.filter(function (c) { return c.type === 'essay'; }).map(function (c) { return c.id; });
var MC_IDS = CONTENT.filter(function (c) { return c.type === 'mc'; }).map(function (c) { return c.id; });
var mcAnswered = {};
var mcSaved = {};

function render() {
  CONTENT.forEach(function (c) {
    if (c.type === 'text') {
      var div = document.createElement('div');
      div.innerHTML = c.html;
      root.appendChild(div);
    } else if (c.type === 'essay') {
      var wrap = document.createElement('div');
      wrap.className = 'item';
      wrap.id = c.id;
      wrap.innerHTML =
        '<div class="resume-badge" id="' + c.id + '-resume" style="display:none;">&#10003; You already have an answer saved here from before -- feel free to revise it.</div>' +
        '<div class="prompt">' + c.prompt + '</div>' +
        '<textarea class="essay" id="' + c.id + '-answer" placeholder="Type your answer and work here."></textarea><br>' +
        '<button class="save-btn" onclick="saveEssay(\'' + c.id + '\')">Save My Answer</button>' +
        '<div class="feedback" id="' + c.id + '-feedback"></div>';
      root.appendChild(wrap);
    } else if (c.type === 'mc') {
      var mwrap = document.createElement('div');
      mwrap.className = 'item';
      mwrap.id = c.id;
      var choicesHtml = c.options.map(function (opt) {
        return '<label class="mc-choice"><input type="radio" name="' + c.id + '" value="' + opt.replace(/"/g, '&quot;') + '"> ' + opt + '</label>';
      }).join('');
      mwrap.innerHTML =
        '<div class="prompt">' + c.prompt + '</div>' +
        choicesHtml +
        '<button class="check-btn" onclick="checkMC(\'' + c.id + '\', \'' + c.correct.replace(/'/g, "\\'") + '\')">Check</button>' +
        '<div class="feedback" id="' + c.id + '-feedback"></div>';
      root.appendChild(mwrap);
    }
  });
}
render();

function bootstrap(cb) {
  fetch(ENDPOINT + '?action=bootstrap&cmid=' + CMID, { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (data) { sesskey = data.sesskey; cb(); })
    .catch(function () { globalStatus.textContent = 'Could not reach the save endpoint.'; });
}

function localBackup(eventtype, payload, complete) {
  try {
    var key = 'foxcs_telemetry_backup_' + CMID;
    var log = JSON.parse(localStorage.getItem(key) || '[]');
    log.push({ eventtype: eventtype, payload: payload, complete: !!complete, ts: new Date().toISOString() });
    if (log.length > 300) log = log.slice(log.length - 300);
    localStorage.setItem(key, JSON.stringify(log));
  } catch (e) {}
}

function logEvent(eventtype, payload, complete) {
  localBackup(eventtype, payload, complete);
  if (!sesskey) { bootstrap(function () { logEvent(eventtype, payload, complete); }); return; }
  var body = new URLSearchParams();
  body.set('action', 'log');
  body.set('sesskey', sesskey);
  body.set('cmid', CMID);
  body.set('eventtype', eventtype);
  body.set('payload', JSON.stringify(payload));
  if (complete) body.set('complete', '1');
  fetch(ENDPOINT, { method: 'POST', credentials: 'same-origin', body: body })
    .then(function (r) { return r.json(); })
    .then(function (data) { globalStatus.textContent = 'Saved ' + new Date().toLocaleTimeString() + '.'; })
    .catch(function () { globalStatus.textContent = 'Save failed, but your answer is backed up in this browser.'; });
}

function currentState() {
  var essay = {};
  ESSAY_IDS.forEach(function (id) { essay[id] = document.getElementById(id + '-answer').value; });
  return { essay: essay, mc: mcAnswered };
}

function saveProgress() {
  logEvent('progress_state', currentState(), false);
  maybeComplete();
}

function saveEssay(id) {
  var val = document.getElementById(id + '-answer').value.trim();
  var fb = document.getElementById(id + '-feedback');
  if (!val) { fb.textContent = 'Write something before saving.'; fb.className = 'feedback incorrect'; return; }
  fb.textContent = 'Saved.';
  fb.className = 'feedback saved';
  logEvent('drill_attempt', { item_id: id, response: val }, false);
  saveProgress();
}

function checkMC(id, correctValue) {
  var selected = document.querySelector('input[name="' + id + '"]:checked');
  var fb = document.getElementById(id + '-feedback');
  if (!selected) { fb.textContent = 'Choose an answer first.'; fb.className = 'feedback incorrect'; return; }
  var correct = selected.value === correctValue;
  fb.textContent = correct ? 'Correct.' : 'Not quite -- look back at the worked example above and try again.';
  fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
  mcAnswered[id] = selected.value;
  mcSaved[id] = true;
  logEvent('drill_attempt', { item_id: id, correct: correct, response: selected.value }, false);
  saveProgress();
}

function wireDraftAutosave(id) {
  var el = document.getElementById(id + '-answer');
  var key = 'foxcs_draft_' + CMID + '_' + id;
  var saved = localStorage.getItem(key);
  if (saved && !el.value) el.value = saved;
  el.addEventListener('input', function () {
    try { localStorage.setItem(key, el.value); } catch (e) {}
  });
}
ESSAY_IDS.forEach(wireDraftAutosave);

function maybeComplete() {
  var essayDone = ESSAY_IDS.every(function (id) { return document.getElementById(id + '-answer').value.trim().length > 0; });
  var mcDone = MC_IDS.every(function (id) { return mcSaved[id]; });
  if (essayDone && mcDone) {
    logEvent('lesson_complete', { activity: 'lesson-2-independent-practice' }, true);
  }
}

function applyState(state) {
  if (!state) return;
  if (state.essay) {
    ESSAY_IDS.forEach(function (id) {
      if (state.essay[id]) {
        document.getElementById(id + '-answer').value = state.essay[id];
        document.getElementById(id + '-resume').style.display = 'block';
      }
    });
  }
  if (state.mc) {
    MC_IDS.forEach(function (id) {
      if (state.mc[id]) {
        var input = document.querySelector('input[name="' + id + '"][value="' + state.mc[id].replace(/"/g, '\\"') + '"]');
        if (input) { input.checked = true; mcAnswered[id] = state.mc[id]; mcSaved[id] = true; }
      }
    });
  }
}

bootstrap(function () {
  fetch(ENDPOINT + '?action=state&cmid=' + CMID, { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (data) { applyState(data.state); })
    .catch(function () {});
  logEvent('viewed', { page: 'lesson-2-independent-practice' }, false);
});
setInterval(function () { if (!document.hidden) { logEvent('heartbeat', {}, false); } }, 30000);
</script>

</body>
</html>
