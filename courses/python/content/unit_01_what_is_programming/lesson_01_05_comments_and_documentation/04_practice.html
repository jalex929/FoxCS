<!-- Plain styling on purpose. See unit_01_overview.html's header comment.
     Interactive practice engine. See lesson_01_01_practice.html for the design note. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01.5 Practice: FoxCS: Python</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; max-width: 720px; margin: 2rem auto; padding: 0 1.5rem; line-height: 1.6; color: #1a1a1a; }
  h1 { font-family: Verdana, Arial, sans-serif; color: #2a3a52; border-bottom: 3px solid #2a78d6; padding-bottom: 0.4rem; }
  .intro { background: #f4f6f9; border-left: 4px solid #2a78d6; padding: 0.8rem 1.2rem; margin-bottom: 1.5rem; }
  .q-block { background: #fff; border: 1px solid #dde3ea; border-radius: 6px; padding: 1.1rem 1.3rem; margin: 1rem 0; }
  .q-block.answered { background: #f9fafb; }
  .prompt { font-weight: bold; margin-bottom: 0.7rem; }
  pre.code { background: #eef1f5; padding: 0.6rem 0.9rem; border-radius: 4px; font-family: Consolas, monospace; overflow-x: auto; }
  input[type=text], textarea { width: 100%; font-family: Consolas, monospace; font-size: 1rem; padding: 0.5rem; box-sizing: border-box; }
  textarea { min-height: 4em; font-family: Georgia, serif; }
  button { font-family: Verdana, Arial, sans-serif; background: #2a78d6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; margin-top: 0.6rem; margin-right: 0.5rem; }
  button:hover { background: #1a5aa8; }
  button:disabled { background: #aab; cursor: default; }
  button.secondary { background: #6a6a6a; }
  .feedback { margin-top: 0.7rem; padding: 0.6rem 0.9rem; border-radius: 4px; }
  .feedback.correct { background: #d7ecd7; color: #1a4a1a; }
  .feedback.incorrect { background: #f4e3d0; color: #6a4a1a; }
  .feedback.info { background: #eef1f5; color: #2a3a52; }
  .model-answer { background: #eef1f5; padding: 0.7rem 0.9rem; border-radius: 4px; margin-top: 0.6rem; font-style: italic; white-space: pre-wrap; }
  #complete-box { background: #f9e1ad; border: 1px solid #eda100; padding: 1.2rem 1.4rem; border-radius: 6px; margin-top: 1.5rem; display: none; }
  .save-reminder { font-weight: bold; color: #7a3a00; }
</style>
</head>
<body>

<h1>01.5 Practice: Comments and Documentation</h1>
<div class="intro">Predict-output questions are checked automatically. Read carefully. Some of these are designed to trip up anyone skimming.</div>

<div id="log"></div>

<div id="complete-box">
  <strong>Practice complete.</strong> Nice work.
  <p class="save-reminder">Click "Save My Work" below, then continue to the Mastery Check.</p>
  <button onclick="saveWork()">Save My Work</button>
  <br><a class="next-link" href="05_project.html" style="display:inline-block;margin-top:0.8rem;">Continue to Project →</a>
</div>

<script>
const QUESTIONS = {
  core_1: {
    type: 'predict',
    prompt: 'Predict what this displays, then type your prediction below.',
    code: 'print("Level 1")\n# print("Level 2 - locked")\nprint("Level 3")\n# print("Level 4 - locked")',
    expected: 'Level 1\nLevel 3',
    feedbackCorrect: 'Right. Both commented-out lines produce no output at all.',
    feedbackIncorrect: 'A line starting with # is a comment, even if it contains what looks like real code. Python skips it entirely.',
    onCorrect: 'extend_1',
    onIncorrect: 'reinforce_1'
  },
  reinforce_1: {
    type: 'predict',
    prompt: 'Predict what this displays.',
    code: '# This line explains the next line\nprint("Score: 0")\n# print("This line is commented out and should not run")\nprint("Game Ready")',
    expected: 'Score: 0\nGame Ready',
    feedbackCorrect: 'Right. Only the two real print() statements produce output.',
    feedbackIncorrect: 'Comments (including ones that look like commented-out code) produce no output. Only the two real print() lines run.',
    onCorrect: 'reinforce_2',
    onIncorrect: 'reinforce_2'
  },
  reinforce_2: {
    type: 'written',
    prompt: 'This comment is weak. It just restates the code below it. Rewrite it so it explains WHY the line exists instead.',
    code: '# print the player\'s score\nprint(100)',
    modelAnswer: 'A strong rewrite explains why, e.g.: "# display the score after the round ends, per the scoreboard design". Not just restating what the code obviously does.',
    onDone: 'done'
  },
  extend_1: {
    type: 'predict',
    prompt: 'Predict what this displays. Hint: the comment rule applies no matter where the # appears on a line, not just at the start.',
    code: 'print("Boss fight starting")  # this comment is AFTER real code on the same line\n# print("Boss fight starting")\nprint("Good luck")',
    expected: 'Boss fight starting\nGood luck',
    feedbackCorrect: 'Right. Everything from a # to the end of that line is ignored, even when the # comes after real code.',
    feedbackIncorrect: 'A # anywhere on a line comments out the rest of that line. The first line still runs its print(), just with the trailing comment ignored; the second line is a full comment and doesn\'t run at all.',
    onCorrect: 'extend_2',
    onIncorrect: 'extend_2'
  },
  extend_2: {
    type: 'written',
    prompt: 'Imagine you\'re on a small team of programmers building a game together, and someone else will read your code next week. Write TWO print() statements with GOOD comments above them. Comments that explain WHY the line exists, not just what it does.',
    modelAnswer: 'Any two real print() statements with comments that state a reason, not just a restatement, earn credit. E.g. "# remind the player of their goal before the timer starts" above a relevant print().',
    onDone: 'done'
  }
};

let logEl = document.getElementById('log');

function normalize(s) {
  return s.trim().replace(/\r\n/g, '\n').split('\n').map(l => l.trim()).join('\n');
}

function renderQuestion(id) {
  if (id === 'done') { document.getElementById('complete-box').style.display = 'block'; return; }
  const q = QUESTIONS[id];
  const block = document.createElement('div');
  block.className = 'q-block';
  block.id = 'block-' + id;
  let inner = '<p class="prompt">' + q.prompt + '</p>';
  if (q.code) { inner += '<pre class="code">' + q.code + '</pre>'; }
  if (q.type === 'predict') {
    inner += '<input type="text" id="text-' + id + '" placeholder="Type exactly what you think the output will be">';
    inner += '<div><button onclick="checkPredict(\'' + id + '\')">Check Answer</button></div>';
  } else if (q.type === 'written') {
    inner += '<textarea id="text-' + id + '" placeholder="Type your answer here..."></textarea>';
    inner += '<div><button onclick="revealModel(\'' + id + '\')" class="secondary">Show Model Answer</button>';
    inner += '<button onclick="finishWritten(\'' + id + '\')">I\'m Done. Continue</button></div>';
  }
  inner += '<div class="feedback" id="feedback-' + id + '" style="display:none"></div>';
  block.innerHTML = inner;
  logEl.appendChild(block);
  block.scrollIntoView({behavior: 'smooth', block: 'end'});
}

function lockBlock(id) {
  const block = document.getElementById('block-' + id);
  block.classList.add('answered');
  block.querySelectorAll('input, textarea, button').forEach(el => el.disabled = true);
}

function checkPredict(id) {
  const q = QUESTIONS[id];
  const val = document.getElementById('text-' + id).value;
  if (!val.trim()) { alert('Type your prediction first.'); return; }
  const isCorrect = normalize(val) === normalize(q.expected);
  const fb = document.getElementById('feedback-' + id);
  fb.style.display = 'block';
  fb.className = 'feedback ' + (isCorrect ? 'correct': 'incorrect');
  fb.textContent = (isCorrect ? q.feedbackCorrect: q.feedbackIncorrect) + (isCorrect ? '': ' (Expected: ' + q.expected.replace(/\n/g, ' / ') + ')');
  lockBlock(id);
  renderQuestion(isCorrect ? q.onCorrect: q.onIncorrect);
}

function revealModel(id) {
  const q = QUESTIONS[id];
  const fb = document.getElementById('feedback-' + id);
  fb.style.display = 'block';
  fb.className = 'feedback info';
  fb.innerHTML = '<div class="model-answer">' + q.modelAnswer + '</div>';
}

function finishWritten(id) {
  const q = QUESTIONS[id];
  lockBlock(id);
  renderQuestion(q.onDone);
}

// Save-in-place, added 2026-08-04 per Jay: the goal is overwriting this same file
// where it already lives, not downloading a new copy to the Downloads folder.
// Uses the File System Access API (showSaveFilePicker) where available. Chrome/Edge,
// including ChromeOS, which covers most school Chromebooks. First save asks the
// Learner to pick the file once (suggest re-selecting this same file, to overwrite
// it); the browser's picker remembers the handle after that, so every save after the
// first is silent, no dialog. NOT yet tested on real school devices over file:// —
// see 05-grader/README.md's Testing Needs. Falls back to a classic download for
// browsers without the API (Firefox, Safari), where in-place overwrite isn't possible.
let savedFileHandle = null;

function currentFileName() {
  const parts = location.pathname.split('/');
  return decodeURIComponent(parts[parts.length - 1]) || 'lesson_01_05_practice.html';
}

async function saveWork() {
  const htmlContent = '<!DOCTYPE html>' + document.documentElement.outerHTML;

  if (savedFileHandle) {
    try {
      const writable = await savedFileHandle.createWritable();
      await writable.write(htmlContent);
      await writable.close();
      return;
    } catch (err) {
      savedFileHandle = null;
    }
  }

  if ('showSaveFilePicker' in window) {
    try {
      savedFileHandle = await window.showSaveFilePicker({
        suggestedName: currentFileName(),
        types: [{ description: 'HTML file', accept: {'text/html': ['.html']} }]
      });
      const writable = await savedFileHandle.createWritable();
      await writable.write(htmlContent);
      await writable.close();
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }

  const blob = new Blob([htmlContent], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFileName();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Only start fresh at Core if this is a brand-new page load. Reopening a file that
// was already saved mid-progress has the earlier answered questions baked into the
// HTML already — re-running renderQuestion('core_1') here would duplicate them.
if (logEl.children.length === 0) {
  renderQuestion('core_1');
}
</script>

</body>
</html>
