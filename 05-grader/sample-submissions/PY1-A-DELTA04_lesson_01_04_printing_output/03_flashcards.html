     6.84:1. Self-assessment (per-term rating + save) was tried and then dropped
     2026-08-06 per Jay — that signal now lives in the feedback form's open-ended
     vocab question instead (11_feedback.html — since revised 2026-08-11 to list
     the terms directly rather than ask students to recall them from memory),
     which gets specific, useful answers without adding a save mechanism to
     flashcards at all. This file stays pure throwaway practice: no filesystem
     writes, nothing to submit, just flip and repeat.

     Back/TOC/Next footer added 2026-08-11 per Jay — see 00_table_of_contents.html. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1.4.3 Flashcards: FoxCS: Python</title>
<style>
  body { font-family: Verdana, Arial, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1.5rem; color: #1a1a1a; }
  h1 { color: #2a3a52; border-bottom: 3px solid #1a5aa8; padding-bottom: 0.4rem; }

  .progress-wrap { margin-bottom: 1.2rem; }
  .progress-label { font-size: 0.85rem; color: #444; margin-bottom: 0.3rem; }
  .progress-bar { background: #e2e7ee; border-radius: 6px; height: 8px; overflow: hidden; }
  .progress-fill { background: #1a5aa8; height: 100%; border-radius: 6px; transition: width 0.3s; }

  .card-scene { perspective: 1400px; }
  .card { position: relative; width: 100%; min-height: 220px; cursor: pointer; }
  .card-inner { position: relative; width: 100%; height: 100%; min-height: 220px; transition: transform 0.5s cubic-bezier(0.4,0.2,0.2,1); transform-style: preserve-3d; }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; padding: 1.8rem; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card-front { background: #f4f6f9; border: 3px solid #1a5aa8; }
  .card-back { background: #1a5aa8; color: white; transform: rotateY(180deg); text-align: left; align-items: flex-start; justify-content: center; }
  .face-label { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: bold; opacity: 0.75; margin-bottom: 0.6rem; }
  .card-front .face-label { color: #1a5aa8; }
  .card-back .face-label { color: #eaf1fb; }
  .term-text { font-size: 1.7rem; font-weight: bold; color: #1a3a5c; }
  .def-text { font-size: 1.1rem; font-family: Georgia, serif; line-height: 1.5; }

  .hint { color: #555; font-size: 0.85rem; margin-top: 0.7rem; text-align: center; }

  .example-btn-wrap { text-align: center; margin-top: 0.8rem; }
  button.example-btn { background: #9a5a00; color: white; border: none; padding: 0.5rem 1.1rem; border-radius: 4px; cursor: pointer; font-family: Verdana, Arial, sans-serif; font-weight: bold; font-size: 0.9rem; }
  button.example-btn:hover { background: #7a4800; }
  .example-box { background: #eef1f5; font-family: Consolas, monospace; text-align: left; padding: 0.8rem 1rem; border-radius: 6px; margin-top: 0.8rem; white-space: pre-wrap; display: none; font-size: 0.95rem; }

  .nav-row { display: flex; gap: 0.6rem; justify-content: center; margin-top: 1.4rem; }
  button.nav-btn { background: #1a5aa8; color: white; border: none; padding: 0.6rem 1.4rem; border-radius: 6px; cursor: pointer; font-family: Verdana, Arial, sans-serif; font-weight: bold; font-size: 1rem; }
  button.nav-btn:hover { background: #12467f; }

  .util-row { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.7rem; }
  button.util-btn { background: none; color: #445; border: 1px solid #ccd3dd; padding: 0.35rem 0.9rem; border-radius: 5px; cursor: pointer; font-family: Verdana, Arial, sans-serif; font-size: 0.82rem; }
  button.util-btn:hover { background: #eef1f5; }

  /* Back/TOC/Next footer — added 2026-08-11 per Jay, same pattern as every
     other numbered page in this lesson: anticipate needing to go back to the
     previous page, back to the table of contents, or forward. */
  .page-nav { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #dde3ea; font-family: Verdana, Arial, sans-serif; font-size: 0.9rem; }
  .page-nav-note { color: #555; margin-bottom: 0.6rem; text-align: center; }
  .page-nav-links { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem; }
  .page-nav-prev, .page-nav-next { font-weight: bold; color: #1a5aa8; text-decoration: none; }
  .page-nav-prev:hover, .page-nav-next:hover { text-decoration: underline; }
  .page-nav-toc { color: #445; text-decoration: none; font-size: 0.85rem; border: 1px solid #ccd3dd; padding: 0.3rem 0.8rem; border-radius: 5px; }
  .page-nav-toc:hover { background: #eef1f5; }
</style>
</head>
<body>

<h1>1.4.3 — Flashcards</h1>

<div class="progress-wrap">
  <div class="progress-label">Card <span id="cardNum">1</span> of <span id="cardTotal"></span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="card-scene">
  <div class="card" id="card" onclick="flip()">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front">
        <div class="face-label">Term</div>
        <div class="term-text" id="termText"></div>
      </div>
      <div class="card-face card-back">
        <div class="face-label">Definition</div>
        <div class="def-text" id="defText"></div>
      </div>
    </div>
  </div>
</div>
<div class="hint">Click the card to flip it.</div>

<div class="example-btn-wrap">
  <button class="example-btn" id="exampleBtn" onclick="toggleExample(event)" style="display:none">Show Example</button>
</div>
<div class="example-box" id="exampleBox"></div>

<div class="nav-row">
  <button class="nav-btn" onclick="prevCard()">← Previous</button>
  <button class="nav-btn" onclick="nextCard()">Next →</button>
</div>
<div class="util-row">
  <button class="util-btn" onclick="shuffleCards()">Shuffle</button>
  <button class="util-btn" onclick="restartCards()">Start Over</button>
</div>

<div class="page-nav">
  <div class="page-nav-note">Nothing to save here — flip through as many times as you want, then move on when you're ready.</div>
  <div class="page-nav-links">
    <a href="01_instruction.html" class="page-nav-prev">← Back: Instruction</a>
    <a href="00_table_of_contents.html" class="page-nav-toc">Table of Contents</a>
    <a href="04_vocab_quiz.html" class="page-nav-next">Next: Vocab Quiz →</a>
  </div>
</div>

<script>
let CARDS = [
  {term: 'function', def: 'A named, reusable block of code that performs a specific task. print() is a built-in function.', example: 'print("Hello")\n# print is the function being called'},
  {term: 'string', def: 'Text data surrounded by quote marks: \'Hello\' or "World".', example: '"Hello"\n\'World\'\n# both are strings, single or double quotes work'},
  {term: 'output', def: 'Text or data that your program displays to the screen.'},
  {term: 'argument', def: 'The value you pass into a function. In print("Hello"), "Hello" is the argument.', example: 'print("Hello")\n#       ^^^^^^^ this part is the argument'},
  {term: 'SyntaxError', def: 'An error Python raises when your code breaks a grammar rule, like a missing quote or parenthesis.', example: 'print("Hello\n# missing closing quote -> SyntaxError: EOL while scanning string literal'}
];

let order = CARDS.map((_, i) => i);
let index = 0;

function currentCard() { return CARDS[order[index]]; }

function render() {
  const card = currentCard();
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('termText').textContent = card.term;
  document.getElementById('defText').textContent = card.def;
  document.getElementById('cardNum').textContent = index + 1;
  document.getElementById('cardTotal').textContent = CARDS.length;
  document.getElementById('progressFill').style.width = (((index + 1) / CARDS.length) * 100) + '%';

  const exampleBtn = document.getElementById('exampleBtn');
  const exampleBox = document.getElementById('exampleBox');
  exampleBox.style.display = 'none';
  exampleBox.textContent = '';
  exampleBtn.style.display = card.example ? 'inline-block' : 'none';
  exampleBtn.textContent = 'Show Example';
}

function flip() {
  document.getElementById('card').classList.toggle('flipped');
}

function toggleExample(evt) {
  evt.stopPropagation();
  const card = currentCard();
  const exampleBox = document.getElementById('exampleBox');
  const exampleBtn = document.getElementById('exampleBtn');
  const showing = exampleBox.style.display === 'block';
  if (showing) {
    exampleBox.style.display = 'none';
    exampleBtn.textContent = 'Show Example';
  } else {
    exampleBox.textContent = card.example;
    exampleBox.style.display = 'block';
    exampleBtn.textContent = 'Hide Example';
  }
}

function nextCard() { index = (index + 1) % CARDS.length; render(); }
function prevCard() { index = (index - 1 + CARDS.length) % CARDS.length; render(); }

function shuffleCards() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  index = 0;
  render();
}

function restartCards() {
  order = CARDS.map((_, i) => i);
  index = 0;
  render();
}

render();
</script>

</body>
</html>
