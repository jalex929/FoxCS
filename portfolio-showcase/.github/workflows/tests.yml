name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          python -m pip install --quiet ruff==0.16.9
          ruff check .
      - name: Leak scanner (fails on private-workspace content)
        run: python tools/check_showcase_clean.py
      - name: Deterministic grader tests
        run: python -m unittest discover -s grader/tests -v
      - name: On-submission grader, release check and model runner at 100% line and branch coverage
        run: |
          python -m pip install --quiet coverage==7.6.1
          python -m coverage run --branch --include=grader/on_submission.py,grader/release_check.py,evals/run_model.py -m unittest discover -s grader/tests
          python -m coverage run --append --branch --include=grader/on_submission.py,grader/release_check.py,evals/run_model.py -m unittest discover -s evals/tests
          python -m coverage report -m --fail-under=100
      - name: Eval harness tests
        run: python -m unittest discover -s evals/tests -v
      - name: Repo hygiene and scanner tests
        run: python -m unittest discover -s tools/tests -v
      - name: Grader demo run on synthetic submissions
        run: python grader/auto_grade.py grader/sample-submissions --out-dir /tmp/demo-output
      - name: Eval suite against reference judgments
        run: python evals/run_evals.py --outputs evals/reference-outputs

  mutation:
    # Every mutant of the grading code must be caught by a test, or be listed
    # with a reason in tools/mutation_equivalents.json. Takes a few minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mutation testing (on-submission grading, release check, eval scorer, model runner)
        run: python tools/mutation_test.py --jobs 4 --report mutation-report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.json
